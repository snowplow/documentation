<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330">
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#a98af0"/>
 </marker>
</defs>
<rect width="1000" height="330" fill="#ffffff"/>
<g font-family="'Source Sans 3', Helvetica, Arial, sans-serif" text-anchor="middle">

 <!-- two browser windows -->
 <g>
  <rect x="60" y="30" width="330" height="170" rx="12" fill="#ffffff" stroke="#d9cdf3" stroke-width="2"/>
  <path d="M60,42 Q60,30 72,30 H378 Q390,30 390,42 V60 H60 Z" fill="#e4d8fa"/>
  <rect x="610" y="30" width="330" height="170" rx="12" fill="#ffffff" stroke="#d9cdf3" stroke-width="2"/>
  <path d="M610,42 Q610,30 622,30 H928 Q940,30 940,42 V60 H610 Z" fill="#e4d8fa"/>
 </g>
 <g fill="#a98af0">
  <circle cx="80" cy="45" r="5"/><circle cx="96" cy="45" r="5"/><circle cx="112" cy="45" r="5"/>
  <circle cx="630" cy="45" r="5"/><circle cx="646" cy="45" r="5"/><circle cx="662" cy="45" r="5"/>
 </g>
 <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2b1a4f">
  <text x="240" y="50">brandA.com</text>
  <text x="790" y="50">brandB.com</text>
 </g>

 <g font-size="14" fill="#6638b8">
  <text x="225" y="84">Logs in</text>
  <text x="775" y="84">Arrives for the first time</text>
 </g>
 <g fill="#f1ebfb" stroke="#d9cdf3" stroke-width="1.5">
  <rect x="95" y="96" width="260" height="30" rx="15"/>
  <rect x="95" y="136" width="260" height="30" rx="15"/>
  <rect x="645" y="96" width="260" height="30" rx="15"/>
  <rect x="645" y="136" width="260" height="30" rx="15"/>
 </g>
 <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2b1a4f">
  <text x="225" y="116">domain_userid: dA1</text>
  <text x="225" y="156">user_id: u001</text>
  <text x="775" y="116">domain_userid: dB1</text>
  <text x="775" y="156">refr_domain_userid: dA1</text>
 </g>

 <!-- the link between the sites -->
 <path d="M394,115 H606" fill="none" stroke="#a98af0" stroke-width="2.5" marker-end="url(#arrow)"/>
 <text x="500" y="104" font-size="14" font-weight="700" fill="#6638b8">follows a link</text>
 <text x="500" y="138" font-size="13" fill="#2b1a4f">cross-domain tracking</text>
 <text x="500" y="154" font-size="13" fill="#2b1a4f">passes dA1 along</text>

 <!-- one Snowplow ID -->
 <g fill="none" stroke="#a98af0" stroke-width="2.5" marker-end="url(#arrow)">
  <path d="M225,204 C225,246 320,264 394,264"/>
  <path d="M775,204 C775,246 680,264 606,264"/>
 </g>
 <rect x="398" y="236" width="204" height="56" rx="10" fill="#6638b8"/>
 <text x="500" y="260" font-size="17" font-weight="700" fill="#ffffff">sp_001</text>
 <text x="500" y="280" font-size="13" fill="#e4d8fa">activity on both sites</text>

 <text x="500" y="318" font-size="16" fill="#2b1a4f">dA1, dB1, and u001 all read sp_001, even though the user hasn't logged in on brandB.com.</text>
</g>
</svg>
