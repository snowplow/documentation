<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330">
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#a98af0"/>
 </marker>
</defs>
<rect width="1000" height="330" fill="#ffffff"/>
<g font-family="'Source Sans 3', Helvetica, Arial, sans-serif" text-anchor="middle">

 <!-- group titles -->
 <g font-size="16" font-weight="700" fill="#2b1a4f">
  <text x="280" y="40">Context: events before the anchor</text>
  <text x="810" y="40">Outcome: events after</text>
 </g>

 <!-- event groups -->
 <g fill="#ffffff" stroke="#d9cdf3" stroke-width="2">
  <rect x="40" y="56" width="480" height="72" rx="12"/>
  <rect x="660" y="56" width="300" height="72" rx="12"/>
 </g>

 <!-- events in the session; the goal event is highlighted -->
 <g fill="#f1ebfb" stroke="#d9cdf3" stroke-width="1.5">
  <rect x="58" y="74" width="140" height="36" rx="18"/>
  <rect x="210" y="74" width="140" height="36" rx="18"/>
  <rect x="362" y="74" width="140" height="36" rx="18"/>
  <rect x="676" y="74" width="130" height="36" rx="18"/>
  <rect x="816" y="74" width="128" height="36" rx="18" fill="#6638b8" stroke="#6638b8"/>
 </g>
 <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2b1a4f">
  <text x="128" y="97">page_view</text>
  <text x="280" y="97">product_view</text>
  <text x="432" y="97">add_to_cart</text>
  <text x="741" y="97">page_view</text>
  <text x="880" y="97" fill="#ffffff">transaction</text>
 </g>

 <!-- the anchor -->
 <rect x="540" y="72" width="100" height="40" rx="20" fill="#6638b8"/>
 <text x="590" y="98" font-size="16" font-weight="700" fill="#ffffff">Anchor</text>

 <g fill="none" stroke="#a98af0" stroke-width="2.5" marker-end="url(#arrow)">
  <path d="M522,92 H536"/>
  <path d="M642,92 H656"/>
  <path d="M280,130 V198"/>
  <path d="M810,130 V198"/>
 </g>
 <g font-size="13" fill="#6638b8" text-anchor="start">
  <text x="292" y="170">computed into attributes</text>
  <text x="822" y="170">sets the outcome</text>
 </g>

 <!-- the dataset row -->
 <rect x="40" y="202" width="920" height="64" rx="10" fill="#6638b8"/>
 <text x="70" y="240" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">One row</text>
 <g fill="#f1ebfb">
  <rect x="160" y="218" width="170" height="32" rx="16"/>
  <rect x="342" y="218" width="130" height="32" rx="16"/>
  <rect x="690" y="218" width="240" height="32" rx="16"/>
 </g>
 <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6638b8">
  <text x="245" y="239">product_views = 1</text>
  <text x="407" y="239">cart_adds = 1</text>
  <text x="810" y="239">purchased_later = true</text>
 </g>

 <text x="500" y="306" font-size="18" fill="#2b1a4f">Attributes only see events before the anchor. The outcome comes from events after it.</text>
</g>
</svg>
